services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: silver_volunteer
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d silver_volunteer']
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - '5432:5432'

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: '5432'
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: silver_volunteer
      PORT: '3000'
      JWT_SECRET: silver-volunteer-secret-2026
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - '8080:80'

volumes:
  pgdata:
